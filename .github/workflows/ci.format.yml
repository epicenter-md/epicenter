# The authoritative merge gate. `bun run check` is the same gate locally, so a
# green local run predicts a green PR; this job exists to run it on hardware
# nobody can forget to use.
#
# Every step below is a root script rather than an inline command, and the
# structural checks arrive as one `check:structure` step rather than a list, so
# there is exactly one place a check can be added or removed. A step list copied
# here would drift from `bun run check` the first time someone edited only one
# of them.
#
# Deliberately NOT in this gate:
#   - Formatting. ci.autofix.yml runs `bun run format` and pushes the fix, so
#     failing here would only tell a contributor what a bot is already doing.
#     `bun run check` still runs `format:check` locally, before the push.
#   - `bun run check:doc-hygiene`. Its ADR-staleness rule is time-based, so a
#     PR that touched nothing can go red on a calendar day. It stays an explicit
#     review command (see 91c4a87c1b), not a merge blocker.
#   - Runtime parity and Gmail drift. Those need Docker, Postgres, S3, or a live
#     Google endpoint; they keep their own workflows on their own triggers.
name: Code quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Errors only, as GitHub annotations: the warning debt stays visible in
      # local `bun run lint:check`, not in every CI log. Exit semantics are
      # unchanged (warnings never fail either command). The Biome plugin at
      # scripts/biome/c-json-errors.grit rejects ad-hoc c.json({ ... }, 4xx/5xx)
      # error literals as part of this step; it needs no separate one.
      - name: Lint check
        run: bun run lint:ci
      - name: Type check
        run: bun run typecheck
      # Every test the workspace declares. A package is only covered here if its
      # package.json declares a `test` script, because `bun run --filter '*'`
      # skips packages that do not: adding *.test.ts without that script is a
      # silent no-op. The repo's own tooling tests (scripts/, .agents/skills/)
      # run in the same command.
      #
      # One test needs a toolchain the rest do not:
      # apps/epicenter/scripts/build-sidecar.test.ts shells out to `rustc -vV`
      # for the host target triple, and builds three SPAs plus a compiled binary
      # first. This is the first Epicenter workflow to run anything Rust, so if
      # that step fails with a missing rustc rather than an assertion, add
      # `uses: dtolnay/rust-toolchain@stable` above. Everything else in the
      # suite spawns only `bun` and `git`.
      - name: Test
        run: bun run test
      # The deterministic structural checks, as one step. What each rejects is
      # documented at the top of its own script under scripts/:
      # doc-paths, catalog-pins, api-paths, license-graph, ui-boundary,
      # boot-purity. Add a check to `check:structure` in package.json, not here.
      - name: Structural checks
        run: bun run check:structure
