name: Code quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Errors only, as GitHub annotations: the warning debt stays visible in
      # local `bun run lint:check`, not in every CI log. Exit semantics are
      # unchanged (warnings never fail either command).
      - name: Lint check
        run: bun run lint:ci
      - name: Type check
        run: bun run typecheck
      # Rejects backtick-wrapped repo-rooted file paths in living docs that are
      # not tracked. Excludes specs, articles, skills, agent prompts, and
      # ignore-file-marked docs. See scripts/check-doc-paths.ts.
      - name: Check doc file references
        run: bun run check:doc-paths
      # Rejects floating specs (latest, *, dist-tags) in the bun catalog. A
      # catalog entry IS the version pin; a floating one reintroduces lockfile
      # drift that only surfaces as a frozen-install failure here, days later,
      # on whoever opens the next PR. See scripts/check-catalog-pins.ts.
      - name: Check catalog pins
        run: bun run check:catalog-pins
      # The Biome plugin at scripts/biome/c-json-errors.grit rejects ad-hoc
      # c.json({ ... }, 4xx/5xx) error literals as part of `bun run lint:ci`
      # above; no separate step is needed.
      # Rejects wire URL path literals hardcoded outside
      # packages/constants/src/{api,oauth}-routes.ts. See
      # scripts/check-api-paths.ts for the rule and its exclusions.
      - name: Reject hardcoded API path literals
        run: bun run check:api-paths
