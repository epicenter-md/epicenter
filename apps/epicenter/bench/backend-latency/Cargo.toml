[package]
name = "backend-latency-bench"
version = "0.0.0"
edition = "2021"
publish = false
description = "Latency falsifier for Epicenter's asymmetric transcription backend collapse"

# Standalone workspace on purpose. This crate must never join
# apps/epicenter/src-tauri's workspace or lockfile: the production manifest
# decides the shipped backend posture, and a benchmark that can move that
# decision is not a benchmark. Nothing here is reachable from the app build.
[workspace]

[[bin]]
name = "backend-latency"
path = "src/main.rs"

[dependencies]
hound = "3.5"
serde_json = "1"
# Pinned exactly, not floated. This measures the posture of the library the app
# actually ships (apps/epicenter/src-tauri/Cargo.lock resolves 0.1.2); a bench
# that silently drifted to a newer native core would compare two things at once.
transcribe-cpp = { version = "=0.1.2", default-features = false }
# The native core is the subject of the measurement, so pin it here rather than
# leaving it to a lockfile someone may regenerate. transcribe-cpp 0.1.2 depends
# on `transcribe-cpp-sys 0.1.2` as a caret range, which resolves to 0.1.3 and
# silently links a different C++ tree than the bindings were generated against.
# The harness reports `transcribe_cpp_compiled` next to `transcribe_cpp_runtime`
# so that skew is visible; this pin is what keeps them equal.
transcribe-cpp-sys = { version = "=0.1.2", default-features = false }

# Exactly one posture must be selected; src/main.rs refuses zero or two. There
# is deliberately no default, because a benchmark whose posture can be picked
# up by accident is the failure mode this whole harness exists to prevent.
[features]
static-cpu = []
static-metal = ["transcribe-cpp/metal"]
dynamic-vulkan = ["transcribe-cpp/dynamic-backends", "transcribe-cpp/vulkan"]

# A benchmark of an unoptimized build measures nothing. Always run --release;
# the harness records opt-level so a debug run is visible in the output.
[profile.release]
debug = false
