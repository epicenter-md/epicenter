<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>sync lab</title>
		<style>
			body {
				font:
					16px / 1.5 system-ui,
					sans-serif;
				margin: 0;
				padding: 1.5rem;
				max-width: 40rem;
			}
			h1 {
				font-size: 1.1rem;
				margin: 0 0 0.25rem;
			}
			#status {
				font-size: 0.8rem;
				color: #666;
				font-family: ui-monospace, monospace;
				word-break: break-word;
			}
			form,
			.controls {
				display: flex;
				gap: 0.5rem;
				margin: 1rem 0;
			}
			input {
				flex: 1;
				padding: 0.6rem;
				font-size: 1rem;
				border: 1px solid #ccc;
				border-radius: 6px;
			}
			button {
				padding: 0.6rem 0.9rem;
				font-size: 1rem;
				border-radius: 6px;
				border: 1px solid #ccc;
				background: #fff;
			}
			ul {
				list-style: none;
				padding: 0;
				margin: 0;
			}
			li {
				padding: 0.5rem 0.6rem;
				border-radius: 6px;
				margin-bottom: 0.35rem;
			}
			li.mine {
				background: #eef4ff;
			}
			li.theirs {
				background: #f3f3f3;
			}
		</style>
	</head>
	<body>
		<h1>sync lab</h1>
		<p id="status"></p>
		<div class="controls">
			<input
				id="title"
				placeholder="type something and press enter"
				autocomplete="off"
			>
			<button id="record">record</button>
		</div>
		<div class="controls">
			<button id="paste">paste 3 MB (chunking)</button>
		</div>
		<ul id="rows"></ul>
		<script type="module" src="/ui/main.ts"></script>
	</body>
</html>
