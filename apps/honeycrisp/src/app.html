<!doctype html>
<html lang="en" class="style-vega dark" style="color-scheme: dark">
	<head>
		<meta charset="utf-8">
		<link rel="icon" href="%sveltekit.assets%/favicon.ico">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Honeycrisp</title>
		<!--
			Honeycrisp is dark, so the html tag above is already correct and this
			only undoes it for someone who chose light. ModeWatcher ships the same
			pre-paint script, but it arrives through `svelte:head`, and this app
			sets `ssr = false`, so nothing from a component reaches the served
			HTML: its copy runs after first paint, which is too late to prevent
			the flash. Only `light` is tested because `toggleMode` writes exactly
			`light` or `dark` and no surface calls `resetMode`, so `system` is
			never stored.
		-->
		<script>
			if (localStorage.getItem('mode-watcher-mode') === 'light') {
				document.documentElement.classList.remove('dark');
				document.documentElement.style.colorScheme = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
